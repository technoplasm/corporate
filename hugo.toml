baseURL = 'https://technoplasm.jp/'
locale = 'ja'
title = '株式会社テクノプラズム'

[params]
  description = 'テクノロジーで医療現場を支援する株式会社テクノプラズムのウェブサイトです'
  contact_email = 'info@technoplasm.jp'
  turnstile_site_key = '0x4AAAAAAFR7sWbtiIm2JjDc'
  contact_kinds = ['製品・サービスについて', '共同研究・連携', '行政・公的機関から', '報道・取材', '採用', 'その他']

[permalinks]
  blog = '/blog/:contentbasename/'
  news = '/news/:contentbasename/'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
    disableWatch = true
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'node_modules/overlayscrollbars/styles'
    target = 'assets/css/overlayscrollbars'
